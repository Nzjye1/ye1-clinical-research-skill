      - "SENS.CVCC-PRED-ISO-001.ASSESSMENT-IPCW.V1（development-fitted stabilized weights，冻结 1/99 百分位截断，exploratory）"
    constraints:
      - "FORMAL 仅支持 legacy formal-temporal-fine-gray-task@1.0.0 或 CVCC task V4 formal-temporal-fine-gray-task@2.0.0，且同时存在对应 frozen SAP checksum 与独立人工 FORMAL execution authorization。"
      - "公共入口和注册插件必须把两个 FORMAL task 版本分派到 observed FORMAL runner；0.1.0 PILOT、未知版本与 FORMAL/PILOT 混淆不得进入该 runner。"
      - "官方 JSON/YAML loader 对 Schema 等价的 numeric integer/double 与一层 array list/vector 表示做类型稳健、值和顺序严格的运行时比较；未知字段、嵌套数组、语义或 checksum 漂移继续 fail-closed。"
      - "能力实现状态不构成当前 FORMAL execution authorization；SYNTHETIC_TEST 不得携带或推断正式授权。"
      - "禁止自动变量选择、额外模型、交互、调参、变换变化、验证集重拟合/再校准和 logistic 替代。"
      - "outcome-unobserved 必须在 last-known observation time 右删失，UTA/其他未观察不得编码为 84h 无事件。"
      - "仅两个冻结 exploratory sensitivity；不得替换、重写或 rescue 主结果。"
      - "bootstrap 失败只保留 requested/completed/failed 计数与首个 allowlisted 错误码；未经清洗的 conditionMessage 不得落盘。"
