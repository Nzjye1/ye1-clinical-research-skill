      - "零 follow-up 使用 log1p 构造内部插补辅助特征；单水平 development 插补目标使用确定性常量运输；残余 follow-up/feature/fit/prediction/completion 问题返回 1.2.0 allowlisted 安全子阶段码"
      - "冻结结构常量 Fine-Gray 列确定性约束为零贡献且保留全部参数槽；非结构性奇异、Fine-Gray 展开、weighted Cox、方差和预测问题返回 1.3.0 allowlisted 安全子阶段码"
      - "bootstrap requested/completed/failures/seeds、optimism、shrinkage 和固定模型 CI"
      - "validation refit=false、recalibration=false 与 clinical-utility claim gate"
      - "DATA_SEMANTICS、IMPUTATION、PRIMARY_FIT、INTERNAL_BOOTSTRAP、VALIDATION_BOOTSTRAP、SENSITIVITY、RESULT_VALIDATION 阶段检查点与 allowlisted 安全错误码"
      - "正式模型前必需列、类型、值域、缺失性、类别运输、变换有限性、分区/隔离和事件门槛检查"
    sensitivities:
