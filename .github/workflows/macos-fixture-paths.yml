name: Clinical macOS public-fixture path diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paths:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install the same official R framework used by the failed run
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64 && test "$RUNNER_ARCH" = ARM64
          curl --fail --location --proto '=https' --tlsv1.2 https://cran.r-project.org/bin/macosx/sonoma-arm64/base/R-4.6.1-arm64.pkg -o "$RUNNER_TEMP/R-4.6.1-arm64.pkg"
          echo '67f6eea4ced4ce48f0a0d4fa3a1cac43d1859a05a88993ee3dff7c52e7edbc4b  '"$RUNNER_TEMP/R-4.6.1-arm64.pkg" | shasum -a 256 -c -
          sudo installer -pkg "$RUNNER_TEMP/R-4.6.1-arm64.pkg" -target /
      - name: Diagnose each path and all ancestors
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/clinical-results"
          touch "$RUNNER_TEMP/clinical-results/pbc-time-status.csv"
          /usr/bin/python3 -B macos/diagnose_fixture_paths.py --source "$RUNNER_TEMP/clinical-results/pbc-time-status.csv" --output "$RUNNER_TEMP/clinical-results/public-pbc" --rscript /Library/Frameworks/R.framework/Resources/bin/Rscript
